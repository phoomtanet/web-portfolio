version: '3.9'

services:
  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - API_URL=${API_URL}
        - API_KEY=${API_KEY}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - API_URL=${API_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - API_KEY=${API_KEY}